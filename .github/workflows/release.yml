name: Release

# A pushed tag YYYYMMDD-<commit> (the date, UTC+8, and the tagged commit's 7-character hash) builds
# the Linux zips and publishes them as that tag's release; "Run workflow" only builds them, as
# artifacts. The zips are laid out as upstream's, so script/install.sh (and V2bX-script's own
# installer, pointed here) installs them alike.

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-*"

permissions:
  contents: write

env:
  # every core and feature upstream builds, plus this fork's modules (module/)
  TAGS: sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor chain upgrade

jobs:
  build:
    strategy:
      matrix:
        include:
          - goarch: amd64
            name: linux-64
          - goarch: arm64
            name: linux-arm64-v8a
    runs-on: ubuntu-24.04
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
            # the tag names the commit it is on
            [[ "${version#*-}" == "${GITHUB_SHA:0:7}" ]] || { echo "tag $version is not on ${GITHUB_SHA:0:7}"; exit 1; }
          else
            version="$(TZ=Asia/Shanghai date +%Y%m%d)-${GITHUB_SHA:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        if: matrix.goarch == 'amd64'
        run: GOOS= GOARCH= go test -count=1 -tags "$TAGS" ./module/... ./core/

      - name: Build
        run: |
          mkdir -p build_assets
          go build -v -o build_assets/V2bX -tags "$TAGS" -trimpath \
            -ldflags "-X 'github.com/InazumaV/V2bX/cmd.version=$version' -s -w -buildid="

      - name: Package
        run: |
          cp README.md LICENSE build_assets/
          cp example/*.json build_assets/
          for name in geoip geosite; do
            curl -fsSL "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/$name.dat" -o "build_assets/$name.dat"
          done
          cd build_assets
          touch -mt "$(date +%Y01010000)" *
          zip -9qr "../V2bX-${{ matrix.name }}.zip" .
          cd ..
          for method in md5 sha1 sha256 sha512; do
            openssl dgst -$method "V2bX-${{ matrix.name }}.zip" | sed 's/([^)]*)//g' >> "V2bX-${{ matrix.name }}.zip.dgst"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: V2bX-${{ matrix.name }}
          path: V2bX-${{ matrix.name }}.zip*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "V2bX $GITHUB_REF_NAME"
